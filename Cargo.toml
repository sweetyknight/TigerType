[workspace]
# 分组目录不是包；只登记已有实现，不为未开发的平台建立占位 crate。
members = ["crates/shared/contracts", "crates/shared/engine", "crates/shared/input-client", "crates/shared/ui-model", "crates/shared/backend", "crates/windows/ipc", "crates/windows/ui", "crates/windows/input-method", "crates/windows/app", "crates/macos/input-method", "crates/macos/ui", "crates/macos/app", "tools/dev"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
tigertype-contracts = { path = "crates/shared/contracts" }
tigertype-windows-ipc = { path = "crates/windows/ipc" }
tigertype-engine = { path = "crates/shared/engine" }
tigertype-input-client = { path = "crates/shared/input-client" }
tigertype-backend = { path = "crates/shared/backend" }
tigertype-ui-model = { path = "crates/shared/ui-model" }
tigertype-windows-app = { path = "crates/windows/app" }
tigertype-windows-ui = { path = "crates/windows/ui" }
tigertype-macos-input-method = { path = "crates/macos/input-method" }
tigertype-macos-ui = { path = "crates/macos/ui" }
tigertype-macos-app = { path = "crates/macos/app" }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
# 设置文件 settings.toml 的解析；只开 parse+serde，写出用本程序带注释的模板。
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
windows = { version = "=0.62.2", default-features = false }
windows-core = "=0.62.2"
# Apple 平台绑定锁定版本；仅在 Apple 目标链接，Windows 运行共享及纯逻辑测试。
objc2 = "=0.6.5"
objc2-input-method-kit = "=0.3.2"
libc = "=0.2.191"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAttributedString", "NSBezierPath", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSResponder", "NSScreen", "NSScrollView", "NSScroller", "NSStringDrawing", "NSText", "NSTextField", "NSTextView", "NSView", "NSWindow", "NSWorkspace"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
