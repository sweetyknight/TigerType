[workspace]
members = ["crates/contracts", "crates/engine", "crates/frontend", "crates/ipc", "crates/ui", "crates/backend", "crates/tsf", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
tigertype-contracts = { path = "crates/contracts" }
tigertype-ipc = { path = "crates/ipc" }
tigertype-engine = { path = "crates/engine" }
tigertype-frontend = { path = "crates/frontend" }
tigertype-backend = { path = "crates/backend" }
tigertype-ui = { path = "crates/ui" }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
# 设置文件 settings.toml 的解析；只开 parse+serde，写出用本程序带注释的模板。
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
windows = { version = "=0.62.2", default-features = false }
windows-core = "=0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
