[package]
name = "tigertype-macos-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# 源码产物避免与 Windows 同名；打包时部署为 Contents/MacOS/tigertype。
name = "tigertype-macos"
path = "src/main.rs"

[dependencies]
tigertype-contracts.workspace = true
tigertype-input-client.workspace = true
tigertype-backend.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tigertype-macos-input-method.workspace = true
tigertype-macos-ui.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "NSBitmapImageRep", "NSImageRep", "NSImage"] }
libc.workspace = true

[lints]
workspace = true

[[test]]
# 原生图标验收入口必须在主线程执行，不启动 IMKServer 或安装输入法。
name = "native"
path = "src/native_tests.rs"
harness = false
