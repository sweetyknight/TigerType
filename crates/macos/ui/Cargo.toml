[package]
name = "tigertype-macos-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tigertype-contracts.workspace = true
tigertype-ui-model.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
dispatch2.workspace = true

[[test]]
# AppKit 原生测试在进程主线程执行，非 Mac 宿主明确报告未运行。
name = "appkit"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { workspace = true, features = ["NSBitmapImageRep", "NSImageRep"] }

[lints]
workspace = true
