[package]
name = "tigertype-windows-input-method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib 为 TIP DLL；rlib 供本 crate 测试使用。
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tigertype-contracts.workspace = true
tigertype-input-client.workspace = true
tigertype-windows-ipc.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

# 显隐与层级回归在不切换的私有桌面运行，不干扰用户当前应用。
[dev-dependencies]
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops"] }
