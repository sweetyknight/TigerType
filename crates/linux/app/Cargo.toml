[package]
name = "tigertype-linux-app"
default-run = "tigertype-linux-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# 避免 Windows x86 安装器启发式要求测试程序提权；Linux 打包时部署为 tigertype-setup。
name = "tigertype-linux-deploy"
path = "src/setup_main.rs"

[dependencies]
tigertype-contracts.workspace = true
tigertype-input-client.workspace = true
tigertype-backend.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tigertype-linux-input-method.workspace = true
tigertype-linux-ui.workspace = true
gio.workspace = true
libc.workspace = true

[lints]
workspace = true
