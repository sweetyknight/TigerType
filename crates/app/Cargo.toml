[package]
name = "tigertype-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tigertype"
path = "src/main.rs"

# 打包驱动的脚本同步测试须纳入必跑检查的 --tests。
[[example]]
name = "package"
test = true

[dependencies]
tigertype-contracts.workspace = true
tigertype-backend.workspace = true
tigertype-ui.workspace = true
serde.workspace = true
serde_json.workspace = true

# 跨进程传输只在 Windows 组装；macOS 为进程内通道。
[target.'cfg(windows)'.dependencies]
tigertype-ipc.workspace = true
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
