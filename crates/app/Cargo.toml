[package]
name = "tigertype-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tigertype"
path = "src/main.rs"

# 打包驱动的脚本同步测试须纳入必跑检查的 --tests。
[[example]]
name = "package"
test = true

[dependencies]
tigertype-contracts.workspace = true
tigertype-ui.workspace = true
serde.workspace = true
serde_json.workspace = true

# 跨进程传输只在 Windows 组装；macOS 为进程内通道。
[target.'cfg(windows)'.dependencies]
# M1 的 Unix 文件原语尚未实现；合成 Mac 视图预览不链接后台，也不绕过受管目录校验。
tigertype-backend.workspace = true
tigertype-ipc.workspace = true
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# 独立合成预览，不引入 M1 的输入法注册、IMKServer 或后台线程组装。
tigertype-imk = { path = "../imk" }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["NSRunningApplication"] }
