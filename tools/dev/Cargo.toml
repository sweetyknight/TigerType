[package]
name = "tigertype-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 检查器为示例，避免 Windows 测试重链接正在运行的检查程序。
[[example]]
name = "package"
test = true

[dependencies]
serde_json.workspace = true
tigertype-contracts.workspace = true
tigertype-backend.workspace = true

[target.'cfg(windows)'.dependencies]
tigertype-windows-app.workspace = true
tigertype-windows-ui.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Mac 打包使用产品组装层；合成预览不启动正式后台，不链接 Windows 产品。
tigertype-macos-input-method.workspace = true
tigertype-macos-ui.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["NSRunningApplication"] }
tigertype-macos-app.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Linux 打包只由开发工具依赖产品包契约，产品不得反向引用工具。
tigertype-linux-app.workspace = true

# 开发子进程等待分别使用 kqueue 与 pidfd，不用轮询定时器。
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc.workspace = true

[lints]
workspace = true
